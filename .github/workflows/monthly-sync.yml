name: Monthly Sync

on:
  schedule:
    - cron: '15 10 1 * *' # 1st of month, 4:15 A.M. CST in UTC

  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  execute:
    name: Sync
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone GitHub Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Ruby Environment
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Run Full Sync
        run: bundle exec ruby lib/run.rb --full-sync
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_USER_ID: ${{ secrets.STEAM_USER_ID }}
          STEAM_EXCLUDED_GAME_IDS: ${{ secrets.STEAM_EXCLUDED_GAME_IDS }}
          DEKUDEALS_COLLECTION_ID: ${{ secrets.DEKUDEALS_COLLECTION_ID }}
